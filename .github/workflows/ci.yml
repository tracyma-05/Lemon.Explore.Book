name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Project patterns
        env:
          # Optional repository secret: extra regular expressions, one per line (see scripts/check-sensitive.sh).
          SENSITIVE_PATTERNS: ${{ secrets.SENSITIVE_PATTERNS }}
        run: bash scripts/check-sensitive.sh
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build src/Lemon.Explore.Book.Desktop -c Release
      - run: dotnet test tests/Lemon.Explore.Book.Tests -c Release

  web:
    name: Web edition (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Links Skia's native WebAssembly code into the app.
      - run: dotnet workload install wasm-tools
      - run: dotnet publish src/Lemon.Explore.Book.Browser -c Release -o publish/web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish/web/wwwroot
